name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点检查更新
  workflow_dispatch: # 支持手动点击同步

concurrency:
  group: sync-upstream-dev
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync upstream dev
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/SlotSun/dart_simple_live.git
          git fetch origin dev
          git fetch upstream dev

          OLD_SHA="$(git rev-parse origin/dev)"
          NEW_SHA="$(git rev-parse upstream/dev)"

          echo "Current dev:  $OLD_SHA"
          echo "Upstream dev: $NEW_SHA"

          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "No upstream changes."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # dev 只作为上游镜像，不再 merge，避免上游改写历史或同文件修改导致冲突。
          git push origin upstream/dev:refs/heads/dev             --force-with-lease=refs/heads/dev:"$OLD_SHA"

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Trigger APK build
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build_my_app_dev.yaml             --repo "${{ github.repository }}"             --ref master
