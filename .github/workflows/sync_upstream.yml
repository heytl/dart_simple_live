name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点检查更新
  workflow_dispatch: # 支持手动点击同步

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync upstream master and dev
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/SlotSun/dart_simple_live.git
          git fetch origin master dev
          git fetch upstream master dev

          # GitHub Actions 的 GITHUB_TOKEN 不能更新其他 workflow 文件。
          # 因此 master/dev 都同步上游最新源码，但保留各自现有的 .github/workflows。
          # 同步采用“源码快照提交”，不 merge、不 force push，也不引入上游改写后的冲突历史。

          sync_branch() {
            local branch="$1"
            local upstream_ref="upstream/$branch"
            local origin_ref="origin/$branch"
            local work_branch="sync-$branch"

            echo "===== Sync $branch ====="
            echo "Current:  $(git rev-parse "$origin_ref")"
            echo "Upstream: $(git rev-parse "$upstream_ref")"

            # 先取得上游最新完整源码快照。
            git checkout -B "$work_branch" "$upstream_ref"

            # workflow 目录必须保持为本仓库当前版本，避免 GitHub App 权限拒绝。
            rm -rf .github/workflows
            if git cat-file -e "$origin_ref:.github/workflows" 2>/dev/null; then
              git checkout "$origin_ref" -- .github/workflows
            fi

            git add -A

            # 把父提交切回我们自己的当前分支，保留刚才准备好的源码快照。
            # 最终只生成一个普通 fast-forward 同步提交。
            git reset --soft "$origin_ref"

            if git diff --cached --quiet; then
              echo "$branch is already up to date (workflow-only upstream differences are ignored)."
              echo "${branch}_updated=false" >> "$GITHUB_OUTPUT"
              return
            fi

            git commit -m "chore: sync upstream $branch"
            git push origin HEAD:"refs/heads/$branch"

            echo "${branch}_updated=true" >> "$GITHUB_OUTPUT"
          }

          sync_branch master
          sync_branch dev

      - name: Trigger APK build
        if: steps.sync.outputs.dev_updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build_my_app_dev.yaml \
            --repo "${{ github.repository }}" \
            --ref master
